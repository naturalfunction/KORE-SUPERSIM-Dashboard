# Nginx Configuration for your-subdomain.example.com
# Save this to /etc/nginx/sites-available/your-subdomain.example.com

server {
    listen 80;
    server_name your-subdomain.example.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your-subdomain.example.com;

    # SSL Configuration (assuming Certbot/Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/your-subdomain.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-subdomain.example.com/privkey.pem;

    access_log /var/log/nginx/your-subdomain.example.com.access.log;
    error_log /var/log/nginx/your-subdomain.example.com.error.log;

    # Limit request body size (match MAX_CONTENT_LENGTH in config.py)
    client_max_body_size 2m;

    # Rate limit webhook traffic (define this in the http {} block):
    # limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;

    location /webhook/super {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:6001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:6001; # Matches the port in config.py
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook traffic might be large or frequent
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_redirect off;
    }

    # Optional: Serve static files directly via Nginx for better performance
    location /static/ {
        alias /path/to/your/project/app/static/;
        expires 30d;
    }
}
